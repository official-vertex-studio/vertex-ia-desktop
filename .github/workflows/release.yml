
name: Vertex AI Desktop - Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      # Récupération du projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installation de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Installation de Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Vérification des outils
      - name: Check environment
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      # Installation des dépendances
      - name: Install dependencies
        run: npm install

      # Compilation et génération EXE + MSI
      - name: Build Vertex AI Desktop
        run: npm run tauri:build

      # Vérification des installateurs
      - name: Verify installers
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe"
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi"

          if (-not $exe) {
            throw "NSIS EXE installer not found!"
          }

          if (-not $msi) {
            throw "MSI installer not found!"
          }

          Write-Host "EXE installer:"
          $exe | ForEach-Object { Write-Host $_.FullName }

          Write-Host "MSI installer:"
          $msi | ForEach-Object { Write-Host $_.FullName }

      # Création de la GitHub Release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vertex AI Desktop ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
